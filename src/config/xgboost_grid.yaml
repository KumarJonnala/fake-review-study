# TF-IDF is fitted only on the training fold.
# Each combination is evaluated on the validation set.
#
# 36 combinations, down from 288. subsample, colsample_bytree and reg_lambda are pinned
# to single values rather than searched: on sparse TF-IDF text with ~1000 training rows
# they moved validation F1 least, and the full product cost 1152 fits across the four
# datasets. 36 also puts XGBoost on the same tuning budget as SVM (24) and BERT (24), so
# no model in the comparison is advantaged by a larger search.
#
# Restore any of the three to a list to search it again -- nothing else needs changing.
hyperparameters:
  n_estimators: [200, 400, 800]
  max_depth: [3, 5, 7]
  learning_rate: [0.03, 0.10]
  min_child_weight: [1, 3]
  subsample: [1.0]
  colsample_bytree: [1.0]
  reg_lambda: [1]
