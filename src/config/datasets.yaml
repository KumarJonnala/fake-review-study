# Inputs and sampling settings for src/make_datasets_and_splits.py.
#
# THREE SAMPLED datasets, each 1592 rows at 796 real / 796 fake, differing ONLY in what
# the fake half is made of. Holding the real half and the totals fixed is the point: any
# gap in classifier performance between them is then attributable to composition rather
# than to sample size or to which reviews happened to be drawn.
#
# ONE UNSAMPLED dataset, d3_unsampled, which takes every human review and every generated
# review with no subsampling: 2392 rows at 796 real (33.3%) / 1596 fake (66.7%). The
# stratified split preserves that 1:2 ratio in both halves. Because of it, the
# majority-class accuracy baseline is 66.7% rather than 50%, so raw accuracy is not
# readable on its own here and is NOT comparable to the three sampled datasets -- quote
# F1 or PR-AUC instead.
#
# LEAKY COLUMNS. `origin`, `source_dataset` and `cell_id_variation` are written to the
# output for stratification and error analysis. Each determines or narrows the label -- a
# generated filename identifies a model, hence `fake` -- so none may ever reach a
# vectorizer. `is_synthetic`, `model`, and the corpus's own `source` column
# (TripAdvisor/Web/MTurk, where MTurk identifies every human fake) are dropped outright.
#
# `origin` is human_real, human_fake, or the model name. There is no separate `source`
# column: it would be `origin` with the two human values collapsed to "human", which is
# recoverable from `origin` alone.
#
# `Category` and `cell_id` are renamed to `hotel` and `cell_id_variation` on the way out.
# The inputs below keep their own names and are never modified.

seed: 42

inputs:
  # Read-only. The generator and this script only ever read the corpus CSVs.
  human_corpus: data/Hotel_Human_VS_HumanFake_relabelled.csv

  # Named pools. d1/d2/d3 draw from the small local models, d2.5/d3.5 from the large
  # API-served ones; each dataset below names the pool it uses.
  #
  # An entry is either a plain path (the file's own `model` column is the label) or a
  # {path, model} mapping that overrides it. The override exists because the large-model
  # files cannot be told apart by their own metadata -- see large_models below.
  #
  # Rows sharing a (cell_id, rep_index) are deduplicated at load with keep="last": two
  # large-model files contain reruns from an aborted start, and the later row belongs to
  # the run that actually completed. The small-model files contain none, so this is a
  # no-op for d1/d2/d3.
  pools:
    # Listed explicitly, not globbed: qwen comes from its own clean re-run while the other
    # three come from job 1683072. A glob cannot express that, and would silently pick up
    # Hotel_LLM_Reviews_qwen3.5_9b_1683072.csv -- a resume-splice of 144 rows from the job
    # that was killed mid-cell plus 56 added afterwards. All four files were checked to
    # carry byte-identical prompts, so they remain comparable.
    small_models:
      - data/generated/Hotel_LLM_Reviews_gemma4_e4b_1683072.csv
      - data/generated/Hotel_LLM_Reviews_doomgrave_ministral-3_8b_1683072.csv
      - data/generated/Hotel_LLM_Reviews_llama3.2_3b_1683072.csv
      - data/generated/Hotel_LLM_Reviews_qwen3.5_9b_redo_1710344.csv

    # EVERY entry needs a `model` override. The files' own values name router endpoints,
    # not models -- and worse, luna and terra BOTH carry "custom_review-luna-gpt" despite
    # being different runs two hours apart with zero shared texts. Without the override
    # the two collapse into one 800-row model and the four-way balance silently becomes
    # three-way.
    #
    # gemini-3.7 is deliberately ABSENT, not overlooked. 107 of its 400 generations failed
    # with "output too short (1-6 words)", all in the short cells, leaving its four
    # short x zero_shot cells holding 1, 2, 3 and 5 reviews of 25. That caps a balanced
    # five-model draw at 16 x 5 x 1 = 80 rows against the 796 these datasets need.
    large_models:
      - {path: data/generated/Hotel_LLM_Reviews_deepseekv4_flash.csv, model: deepseekv4-flash}
      - {path: data/generated/Hotel_LLM_Reviews_gpt5.6_luna.csv,      model: gpt5.6-luna}
      - {path: data/generated/Hotel_LLM_Reviews_gpt5.6_terra.csv,     model: gpt5.6-terra}
      - {path: data/generated/Hotel_LLM_Reviews_glm-5.3-flash.csv,    model: glm-5.3-flash}

output_dir: data/datasets

split:
  test_size: 0.25
  # `origin` determines the label in all three datasets, so stratifying on it stratifies
  # the label too -- and additionally guarantees each model is proportionally present in
  # the test half, which stratifying on the label alone does not.
  stratify_on: origin

# Counts per block. `all` means every available row -- preferred over writing the literal
# number, because it states the intent and cannot silently under-draw if a synthetic file
# is later added, replaced or corrected.
#
# d1 needs no sampled/unsampled suffix: both its blocks already take the whole corpus.
datasets:
  d1_human_real_vs_human_fake:        {real: 796, human_fake: 796, synthetic: 0,   pool: small_models}
  d2_sampled_human_real_vs_synthetic: {real: 796, human_fake: 0,   synthetic: 796, pool: small_models}
  d3_sampled_human_real_vs_mixed:     {real: 796, human_fake: 398, synthetic: 398, pool: small_models}
  d3_unsampled_human_real_vs_mixed:   {real: all, human_fake: all, synthetic: all, pool: small_models}

  # The .5 pair mirrors d2/d3 exactly, swapping the small-model pool for the large one, so
  # the only thing differing between d2 and d2.5 is which models wrote the fakes.
  #
  # The unsampled pair is far more imbalanced than d3_unsampled's 33/67: the large pool is
  # 1920 rows against the small pool's 800, giving 29.3% and 22.7% real. Their
  # majority-class baselines are 70.7% and 77.3%, so raw accuracy is unreadable on its own
  # and comparable to nothing else here -- quote F1 or PR-AUC. Their synthetic half is also
  # model-skewed (deepseek 800, luna 400, terra 400, glm 320); the sampled pair is the
  # balanced comparison.
  d2.5_sampled_human_real_vs_synthetic:   {real: 796, human_fake: 0,   synthetic: 796, pool: large_models}
  d2.5_unsampled_human_real_vs_synthetic: {real: all, human_fake: 0,   synthetic: all, pool: large_models}
  d3.5_sampled_human_real_vs_mixed:       {real: 796, human_fake: 398, synthetic: 398, pool: large_models}
  d3.5_unsampled_human_real_vs_mixed:     {real: all, human_fake: all, synthetic: all, pool: large_models}
